  </g>

  <!-- Video Play Badge Indicator (Bottom Right) -->
  <circle cx="370" cy="370" r="60" fill="#121212" />
  <circle cx="370" cy="370" r="52" fill="#1db954" />
  <polygon points="360,345 360,395 400,370" fill="#ffffff" />
