<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#1aa34a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" />
  
  <!-- Spotify Sound Waves (Dark Charcoal) -->
  <g fill="#121212" filter="url(#shadow)">
    <!-- Top Wave -->
    <path d="M128 190 C 220 155, 330 165, 396 205 C 406 211, 410 224, 404 234 C 398 244, 385 248, 375 242 C 316 206, 218 197, 137 228 C 126 232, 114 226, 110 215 C 106 204, 112 192, 128 190 Z" />
    <!-- Middle Wave -->
